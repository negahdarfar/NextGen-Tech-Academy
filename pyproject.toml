[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-tech-academy"
version = "0.1.0"
description = "Open-source foundation for an AI-assisted YouTube education workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = ["piper-tts>=1.2"]
cloud = ["edge-tts>=7.0", "google-api-python-client>=2.150", "google-auth>=2.35", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]

[project.scripts]
nextgen-academy = "nextgen_academy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
