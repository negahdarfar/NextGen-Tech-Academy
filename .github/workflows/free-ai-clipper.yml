name: Free AI video clipper
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL of a video you own or have permission to edit"
        required: true
        type: string
      num_clips:
        description: "Number of highlight clips to create"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "5"
          - "8"
      language:
        description: "Source speech language (ISO code)"
        required: true
        default: "en"
        type: string

permissions:
  contents: read

concurrency:
  group: free-ai-clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      LLM_PROVIDER: gemini
      LOCAL_WHISPER_MODEL: base
      LOCAL_WHISPER_DEVICE: cpu
      LOCAL_OUTPUT_DIR: ${ github.workspace }}/output
      PYTHONUTF8: "1"
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Validate inputs and required secret
        env:
          SOURCE_URL: ${ inputs.source_url }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY to repository Actions secrets."
            exit 1
          fi
          case "$SOURCE_URL" in
            https://www.youtube.com/*|https://youtube.com/*|https://youtu.be/*)
              echo "Accepted YouTube URL."
              ;;
            *)
              echo "::error::Provide a standard YouTube https URL."
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-base-${ runner.os }}-v1

      - name: Fetch pinned open-source clipper
        run: |
          git clone https://github.com/Anil-matcha/AI-Youtube-Shorts-Generator.git tools/ai-youtube-shorts-generator
          git -C tools/ai-youtube-shorts-generator checkout 1142a747b0056da5551970e88ca9f1ec85deafc5

      - name: Install free local-mode dependencies
        working-directory: tools/ai-youtube-shorts-generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt

      - name: Find highlights and render vertical clips
        working-directory: tools/ai-youtube-shorts-generator
        env:
          SOURCE_URL: ${ inputs.source_url }}
          NUM_CLIPS: ${ inputs.num_clips }}
          LANGUAGE: ${ inputs.language }}
        run: |
          mkdir -p "$LOCAL_OUTPUT_DIR"
          python main.py "$SOURCE_URL" \
            --mode local \
            --num-clips "$NUM_CLIPS" \
            --aspect-ratio 9:16 \
            --language "$LANGUAGE" \
            --output-json "$LOCAL_OUTPUT_DIR/clip-report.json"

      - name: Save generated clips as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ai-clips-${ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
