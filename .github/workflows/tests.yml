name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/initial-project-foundation, feat/omniroute-integration]
  workflow_dispatch:

concurrency:
  group: omniroute-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q

  omniroute-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: /tmp/omniroute-smoke-data
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "20128"
      REQUIRE_API_KEY: "false"
      OMNIROUTE_MEMORY_MB: "512"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install OmniRoute
        run: |
          OMNIROUTE_SKIP_POSTINSTALL=1 npm install --global omniroute@3.8.54
      - name: Initialize and start local gateway
        shell: bash
        run: |
          set -euo pipefail
          export INITIAL_PASSWORD="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export API_KEY_SECRET="$(openssl rand -hex 32)"
          mkdir -p "$DATA_DIR"
          nohup omniroute --no-open > "$RUNNER_TEMP/omniroute-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute-smoke.pid"
          for attempt in $(seq 1 60); do
            HTTP_CODE="$(curl --silent --output "$RUNNER_TEMP/models-response.txt" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:20128/v1/models || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              python -c "import json,pathlib; data=json.loads(pathlib.Path('$RUNNER_TEMP/models-response.txt').read_text()); assert isinstance(data, dict)"
              echo "OmniRoute models endpoint is reachable."
              exit 0
            fi
            if [ "$HTTP_CODE" = "401" ]; then
              echo "OmniRoute is running and correctly protects its API with authentication."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/omniroute-smoke.log"
          exit 1
      - name: Stop ephemeral gateway
        if: always()
        run: if [ -f "$RUNNER_TEMP/omniroute-smoke.pid" ]; then kill "$(cat "$RUNNER_TEMP/omniroute-smoke.pid")" || true; fi
