name: Long-form documentary factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic"
        required: true
        type: string
      minutes:
        description: "Target documentary duration"
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
      confirm_generation:
        description: "Confirm external LLM, TTS and visual-provider requests"
        required: true
        default: false
        type: boolean
      visual_provider:
        description: "Pexels is zero-budget default; Agnes may be chargeable"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - pexels
          - agnes
      allow_agnes_potential_cost:
        description: "Separate acknowledgement of possible Agnes charges"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nextgen-longform-documentary
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ inputs.confirm_generation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: "freellmapi,openrouter"
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate zero-budget credentials and explicit cost acknowledgements
        shell: bash
        env:
          INPUT_VISUAL_PROVIDER: ${{ inputs.visual_provider }}
          INPUT_ALLOW_AGNES_COST: ${{ inputs.allow_agnes_potential_cost }}
        run: |
          set -euo pipefail
          if { [ -z "$FREELLMAPI_CLOUD_BASE_URL" ] || [ -z "$FREELLMAPI_CLOUD_API_KEY" ]; } && { [ -z "$OPENROUTER_API_KEY" ] || [[ "$OPENROUTER_MODEL" != *:free ]]; }; then
            echo "Zero-budget mode requires the FreeLLMAPI cloud pair or an OpenRouter model explicitly ending in :free."
            exit 1
          fi
          if [ "$INPUT_VISUAL_PROVIDER" = "agnes" ]; then
            [ -n "$AGNES_API_KEY" ] || { echo "AGNES_API_KEY missing"; exit 1; }
            [ "$INPUT_ALLOW_AGNES_COST" = "true" ] || { echo "Agnes potential-cost acknowledgement is required."; exit 1; }
          else
            [ -n "$PEXELS_API_KEY" ] || { echo "Auto/Pexels zero-budget mode requires PEXELS_API_KEY."; exit 1; }
          fi
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application and cloud TTS
        run: python -m pip install -e ".[cloud]"
      - name: Produce documentary (no upload)
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_MINUTES: ${{ inputs.minutes }}
          INPUT_PROVIDER: ${{ inputs.visual_provider }}
          INPUT_ALLOW_AGNES_COST: ${{ inputs.allow_agnes_potential_cost }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$INPUT_ALLOW_AGNES_COST" = "true" ]; then EXTRA_ARGS+=(--allow-agnes-potential-cost); fi
          nextgen-academy documentary-produce --topic "$INPUT_TOPIC" --minutes "$INPUT_MINUTES" --state output/documentary-run.json --output-dir output/documentary --provider "$INPUT_PROVIDER" --confirm-provider-requests "${EXTRA_ARGS[@]}"
      - name: Preserve resumable state and production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-longform-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
