name: Long-form documentary factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic"
        required: true
        type: string
      minutes:
        description: "Target documentary duration"
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
      confirm_generation:
        description: "Confirm external LLM, TTS and visual-provider requests"
        required: true
        default: false
        type: boolean
      visual_provider:
        description: "Visual provider routing"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - agnes
          - pexels

permissions:
  contents: read

concurrency:
  group: nextgen-longform-documentary
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ inputs.confirm_generation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: "freellmapi,openrouter"
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate free-route credentials without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY$OPENROUTER_API_KEY" ] && { [ -z "$FREELLMAPI_CLOUD_BASE_URL" ] || [ -z "$FREELLMAPI_CLOUD_API_KEY" ]; }; then
            echo "No LLM credential detected. Configure FreeLLMAPI, Gemini, Groq, or OpenRouter :free."
            exit 1
          fi
          if [ "$INPUT_VISUAL_PROVIDER" = "agnes" ] && [ -z "$AGNES_API_KEY" ]; then echo "AGNES_API_KEY missing"; exit 1; fi
          if [ "$INPUT_VISUAL_PROVIDER" = "pexels" ] && [ -z "$PEXELS_API_KEY" ]; then echo "PEXELS_API_KEY missing"; exit 1; fi
          if [ "$INPUT_VISUAL_PROVIDER" = "auto" ] && [ -z "$AGNES_API_KEY$PEXELS_API_KEY" ]; then echo "Configure AGNES_API_KEY or PEXELS_API_KEY"; exit 1; fi
        env:
          INPUT_VISUAL_PROVIDER: ${{ inputs.visual_provider }}\n          INPUT_ALLOW_AGNES_COST: ${{ inputs.allow_agnes_potential_cost }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application and cloud TTS
        run: python -m pip install -e ".[cloud]"
      - name: Produce documentary (no upload)
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_MINUTES: ${{ inputs.minutes }}
          INPUT_PROVIDER: ${{ inputs.visual_provider }}\n          INPUT_ALLOW_AGNES_COST: ${{ inputs.allow_agnes_potential_cost }}
        run: |
          set -euo pipefail
          nextgen-academy documentary-produce --topic "$INPUT_TOPIC" --minutes "$INPUT_MINUTES" --state output/documentary-run.json --output-dir output/documentary --provider "$INPUT_PROVIDER" --confirm-provider-requests \\\n            $([ "$INPUT_ALLOW_AGNES_COST" = "true" ] && echo "--allow-agnes-potential-cost")
      - name: Preserve resumable state and production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-longform-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
