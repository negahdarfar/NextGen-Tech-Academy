name: Automated YouTube documentary factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional documentary topic; leave blank for automatic discovery"
        required: false
        type: string
      duration_minutes:
        description: "Documentary duration (3-10 minutes)"
        required: true
        default: "5"
        type: choice
        options: ["3","4","5","6","7","8","9","10"]
      shorts_count:
        description: "Number of vertical highlight clips to extract"
        required: true
        default: "3"
        type: choice
        options: ["3","5","8"]
      upload:
        description: "Upload the finished documentary to YouTube as private"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 6 * * 2,5"
permissions:
  contents: read
concurrency:
  group: nextgen-documentary-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'gemini,groq,openrouter' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_ALLOW_PUBLIC: "false"
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install documentary factory
        run: python -m pip install -e ".[cloud]"
      - name: Produce documentary
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DURATION: ${{ inputs.duration_minutes || '5' }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          UPLOAD=""
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD="--upload"
          elif [ "${INPUT_UPLOAD}" = "true" ]; then
            UPLOAD="--upload"
          fi
          nextgen-academy auto-run --topic "${INPUT_TOPIC}" --duration-minutes "${INPUT_DURATION}" ${UPLOAD}
      - name: Cache local Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: nextgen-faster-whisper-base-${{ runner.os }}-v1
      - name: Fetch pinned open-source highlight clipper
        run: |
          git clone https://github.com/Anil-matcha/AI-Youtube-Shorts-Generator.git tools/ai-youtube-shorts-generator
          git -C tools/ai-youtube-shorts-generator checkout 1142a747b0056da5551970e88ca9f1ec85deafc5
      - name: Install free local clipping dependencies
        working-directory: tools/ai-youtube-shorts-generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt
      - name: Extract vertical highlight clips from the finished documentary
        id: extract_shorts
        continue-on-error: true
        working-directory: tools/ai-youtube-shorts-generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          LLM_PROVIDER: gemini
          LOCAL_WHISPER_MODEL: base
          LOCAL_WHISPER_DEVICE: cpu
          LOCAL_OUTPUT_DIR: ${{ github.workspace }}/output/shorts
          VIDEO_PATH: ${{ github.workspace }}/output/final-video.mp4
          NUM_CLIPS: ${{ inputs.shorts_count || '3' }}
          PYTHONUTF8: "1"
        run: |
          test -s "$VIDEO_PATH"
          mkdir -p "$LOCAL_OUTPUT_DIR"
          python main.py "$VIDEO_PATH" --mode local --num-clips "$NUM_CLIPS" --aspect-ratio 9:16 --language en --output-json "$LOCAL_OUTPUT_DIR/clip-report.json"
      - name: Report highlight extraction status
        if: always()
        env:
          CLIP_STEP_OUTCOME: ${{ steps.extract_shorts.outcome }}
        run: |
          mkdir -p output
          if [ "$CLIP_STEP_OUTCOME" = "success" ]; then
            echo "Short-form highlights: generated successfully." > output/shorts-status.txt
            echo "### Vertical highlight extraction: successful" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Short-form highlights: extraction failed; master documentary is still preserved." > output/shorts-status.txt
            echo "### Vertical highlight extraction: failed (master documentary preserved)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve all production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-documentary-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
