name: Automated YouTube video factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for automatic discovery"
        required: false
        type: string
      upload:
        description: "Upload the result to YouTube as private"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 6 * * 2,5"
permissions:
  contents: read
concurrency:
  group: nextgen-video-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'gemini,groq,openrouter' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_ALLOW_PUBLIC: "false"
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce, render and upload privately
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then UPLOAD=true; else UPLOAD="${INPUT_UPLOAD}"; fi
          if [ "${UPLOAD}" = "true" ]; then
            nextgen-academy auto-run --topic "${INPUT_TOPIC}" --upload
          else
            nextgen-academy auto-run --topic "${INPUT_TOPIC}"
          fi
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-production-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
