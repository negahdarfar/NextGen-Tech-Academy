name: Automated YouTube video factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for automatic discovery"
        required: false
        type: string
      upload:
        description: "Upload the finished video to YouTube"
        required: true
        default: true
        type: boolean
      privacy_status:
        description: "YouTube visibility for manual runs; scheduled runs publish publicly"
        required: true
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private
  schedule:
    - cron: "17 6 * * 2,5"

permissions:
  contents: read

concurrency:
  group: nextgen-video-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '' }}
      ALLOW_PAID_LLM: "false"
      ALLOW_AGNES_POTENTIAL_COST: "false"
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event_name == 'schedule' && 'public' || inputs.privacy_status || 'public' }}
      YOUTUBE_ALLOW_PUBLIC: ${{ (github.event_name == 'schedule' || inputs.privacy_status == 'public') && 'true' || 'false' }}
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-budget production and YouTube credentials
        env:
          FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
          FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
          FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          INPUT_PRIVACY_STATUS: ${{ inputs.privacy_status }}
        run: |
          set -euo pipefail
          [ -n "$PEXELS_API_KEY" ] || { echo "Zero-budget visual production requires PEXELS_API_KEY; Agnes is disabled to prevent charges."; exit 1; }
          if [ -z "$OPENROUTER_API_KEY" ] && [[ "$FREELLMAPI_MODEL" != *:free ]]; then
            echo "Configure OPENROUTER_API_KEY or set FREELLMAPI_MODEL to an explicitly free model ID ending in :free. Auto/unknown pricing is blocked."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$INPUT_UPLOAD" != "false" ]; then
            [ -n "$YOUTUBE_TOKEN_JSON" ] || { echo "Missing YOUTUBE_TOKEN_JSON for YouTube upload."; exit 1; }
          fi
          echo "Zero-budget visual route: Pexels only. Agnes paid route disabled."
          [ -n "$OPENROUTER_API_KEY" ] && echo "OpenRouter free-model fallback: configured" || echo "OpenRouter fallback: not configured"
          [ -n "$FREELLMAPI_CLOUD_API_KEY" ] && echo "FreeLLMAPI route: configured" || echo "FreeLLMAPI route: not configured"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$INPUT_PRIVACY_STATUS" = "public" ]; then
            echo "Public YouTube publishing enabled."
          else
            echo "This manual run is private or unlisted."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce, render and upload to YouTube
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD=true
          else
            UPLOAD="${INPUT_UPLOAD}"
          fi
          if [ "${UPLOAD}" = "true" ]; then
            nextgen-academy auto-run --topic "${INPUT_TOPIC}" --upload
          else
            nextgen-academy auto-run --topic "${INPUT_TOPIC}"
          fi
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-production-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
