name: Automated YouTube video factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for automatic discovery"
        required: false
        type: string
      upload:
        description: "Upload the finished video to YouTube"
        required: true
        default: true
        type: boolean
      privacy_status:
        description: "YouTube visibility for this manual run (scheduled runs remain private)"
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public
      approve_publication:
        description: "Explicitly approve public publishing after reviewing the generated video and metadata"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 6 * * 2,5"

permissions:
  contents: read

concurrency:
  group: nextgen-video-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: freellmapi
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_status || 'private' }}
      YOUTUBE_ALLOW_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_status == 'public' && inputs.approve_publication == true && 'true' || 'false' }}
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - name: Validate required GitHub secrets
        env:
          FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
          FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          INPUT_PRIVACY_STATUS: ${{ inputs.privacy_status }}
          INPUT_APPROVE_PUBLICATION: ${{ inputs.approve_publication }}
        run: |
          set -euo pipefail
          [ -n "$AGNES_API_KEY$PEXELS_API_KEY" ] || { echo "Configure AGNES_API_KEY (Agnes AI video) or PEXELS_API_KEY (free stock footage)."; exit 1; }
          if [ -z "$FREELLMAPI_CLOUD_BASE_URL" ] || [ -z "$FREELLMAPI_CLOUD_API_KEY" ]; then
            echo "FreeLLMAPI is the sole LLM gateway. Configure FREELLMAPI_CLOUD_BASE_URL and FREELLMAPI_CLOUD_API_KEY."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$INPUT_UPLOAD" != "false" ]; then
            [ -n "$YOUTUBE_TOKEN_JSON" ] || { echo "Missing GitHub Actions Secret: YOUTUBE_TOKEN_JSON for private YouTube upload."; exit 1; }
          fi
          echo "Credential presence (values never shown):"
          [ -n "$AGNES_API_KEY" ] && echo "AGNES_API_KEY: present" || echo "AGNES_API_KEY: missing"
          if [ -n "$FREELLMAPI_CLOUD_BASE_URL" ] && [ -n "$FREELLMAPI_CLOUD_API_KEY" ]; then echo "FREELLMAPI cloud pair: present"; else echo "FREELLMAPI cloud pair: missing"; fi
          [ -n "$YOUTUBE_TOKEN_JSON" ] && echo "YOUTUBE_TOKEN_JSON: present" || echo "YOUTUBE_TOKEN_JSON: missing"
          [ -n "$PEXELS_API_KEY" ] && echo "PEXELS_API_KEY: present" || echo "PEXELS_API_KEY: missing"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRIVACY_STATUS" = "public" ]; then
            if [ "$INPUT_APPROVE_PUBLICATION" != "true" ]; then
              echo "::error::Public publishing requires the separate approve_publication confirmation. No video generation or upload will start."
              exit 1
            fi
            echo "Explicit public-publishing approval received."
          else
            echo "This run is private or unlisted; scheduled runs remain private."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce, render and upload to YouTube
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD=true
          else
            UPLOAD="${INPUT_UPLOAD}"
          fi
          if [ "${UPLOAD}" = "true" ]; then
            nextgen-academy auto-run --topic "${INPUT_TOPIC}" --upload
          else
            nextgen-academy auto-run --topic "${INPUT_TOPIC}"
          fi
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-production-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
