name: Automated YouTube video factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for automatic discovery"
        required: false
        type: string
      upload:
        description: "Upload the result to YouTube as private"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 6 * * 2,5"

permissions:
  contents: read

concurrency:
  group: nextgen-video-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'gemini/gemini-2.5-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'omniroute,gemini,groq,openrouter' }}
      VIDOGRID_API_KEY: ${{ secrets.VIDOGRID_API_KEY }}
      VIDOGRID_MODEL_ROTATION: ${{ vars.VIDOGRID_MODEL_ROTATION || 'grok-imagine-video-1.5-lite,veo-3.1-fast,omni-1.2-flash' }}
      VIDOGRID_MODEL_CREDIT_COSTS: ${{ vars.VIDOGRID_MODEL_CREDIT_COSTS }}
      VIDOGRID_TOTAL_BALANCE_IS_FREE: ${{ vars.VIDOGRID_TOTAL_BALANCE_IS_FREE || 'false' }}
      VIDOGRID_CREDITS_PER_CLIP: ${{ vars.VIDOGRID_CREDITS_PER_CLIP }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_ALLOW_PUBLIC: "false"
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install and start ephemeral OmniRoute gateway
        if: env.GEMINI_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --global omniroute@3.8.54 || { echo 'OmniRoute install failed; direct LLM fallback will be used.'; exit 0; }
          export DATA_DIR="$RUNNER_TEMP/omniroute-data"
          export NODE_ENV=production
          export HOSTNAME=127.0.0.1
          export PORT=20128
          export REQUIRE_API_KEY=false
          export OMNIROUTE_MEMORY_MB=1024
          export INITIAL_PASSWORD="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export API_KEY_SECRET="$(openssl rand -hex 32)"
          omniroute setup --non-interactive --password "$INITIAL_PASSWORD" || { echo "OmniRoute setup failed; direct LLM fallback will be used."; exit 0; }
          nohup omniroute --no-open > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute.pid"
          READY=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:20128/v1/models -o "$RUNNER_TEMP/omniroute-models.json"; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            cat "$RUNNER_TEMP/omniroute.log"
            echo "OmniRoute failed to start; direct LLM fallback will be used."
            exit 0
          fi
          if ! grep -Fq "$OMNIROUTE_MODEL" "$RUNNER_TEMP/omniroute-models.json"; then
            echo "Expected Gemini model not available in OmniRoute catalog."
            cat "$RUNNER_TEMP/omniroute-models.json"
            kill "$(cat "$RUNNER_TEMP/omniroute.pid")" || true
            exit 0
          fi
          {
            echo "OMNIROUTE_BASE_URL=http://127.0.0.1:20128/v1"
            echo "OMNIROUTE_MODEL=${OMNIROUTE_MODEL:-gemini/gemini-2.5-flash}"
          } >> "$GITHUB_ENV"
          echo "OmniRoute is ready on the private GitHub-hosted runner."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce, render and upload privately
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD=true
          else
            UPLOAD="${INPUT_UPLOAD}"
          fi
          if [ "${UPLOAD}" = "true" ]; then
            nextgen-academy auto-run --topic "${INPUT_TOPIC}" --upload
          else
            nextgen-academy auto-run --topic "${INPUT_TOPIC}"
          fi
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-production-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
