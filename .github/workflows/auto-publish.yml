name: Automated YouTube video factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for automatic discovery"
        required: false
        type: string
      upload:
        description: "Upload the finished video to YouTube"
        required: true
        default: true
        type: boolean
      privacy_status:
        description: "YouTube visibility for this manual run (scheduled runs remain private)"
        required: true
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private
  schedule:
    - cron: "17 6 * * 2,5"

permissions:
  contents: read

concurrency:
  group: nextgen-video-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL || 'auto' }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'gemini/gemini-2.5-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'freellmapi,omniroute,gemini,groq,openrouter' }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_status || 'private' }}
      YOUTUBE_ALLOW_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_status == 'public' && 'true' || 'false' }}
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - name: Validate required GitHub secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
          FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          INPUT_PRIVACY_STATUS: ${{ inputs.privacy_status }}
        run: |
          set -euo pipefail
          [ -n "$AGNES_API_KEY$PEXELS_API_KEY" ] || { echo "Configure AGNES_API_KEY (Agnes AI video) or PEXELS_API_KEY (free stock footage)."; exit 1; }
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY$OPENROUTER_API_KEY$FREELLMAPI_CLOUD_BASE_URL$FREELLMAPI_CLOUD_API_KEY" ]; then
            echo "Configure at least one LLM provider: FREELLMAPI_CLOUD_BASE_URL + FREELLMAPI_CLOUD_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, or OPENROUTER_API_KEY."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$INPUT_UPLOAD" != "false" ]; then
            [ -n "$YOUTUBE_TOKEN_JSON" ] || { echo "Missing GitHub Actions Secret: YOUTUBE_TOKEN_JSON for private YouTube upload."; exit 1; }
          fi
          echo "Credential presence (values never shown):"
          [ -n "$AGNES_API_KEY" ] && echo "AGNES_API_KEY: present" || echo "AGNES_API_KEY: missing"
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY: present" || echo "GEMINI_API_KEY: missing"
          if [ -n "$FREELLMAPI_CLOUD_BASE_URL" ] && [ -n "$FREELLMAPI_CLOUD_API_KEY" ]; then echo "FREELLMAPI cloud pair: present"; else echo "FREELLMAPI cloud pair: missing"; fi
          [ -n "$GROQ_API_KEY" ] && echo "GROQ_API_KEY: present" || echo "GROQ_API_KEY: missing"
          [ -n "$OPENROUTER_API_KEY" ] && echo "OPENROUTER_API_KEY: present" || echo "OPENROUTER_API_KEY: missing"
          [ -n "$YOUTUBE_TOKEN_JSON" ] && echo "YOUTUBE_TOKEN_JSON: present" || echo "YOUTUBE_TOKEN_JSON: missing"
          [ -n "$PEXELS_API_KEY" ] && echo "PEXELS_API_KEY: present" || echo "PEXELS_API_KEY: missing"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRIVACY_STATUS" = "public" ]; then
            echo "Manual run is configured for PUBLIC YouTube visibility."
          else
            echo "This run is not configured for public visibility."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install and start ephemeral OmniRoute gateway
        if: env.GEMINI_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          OMNIROUTE_SKIP_POSTINSTALL=1 npm install --global omniroute@3.8.54 || { echo 'OmniRoute install failed; direct LLM fallback will be used.'; exit 0; }
          export DATA_DIR="$RUNNER_TEMP/omniroute-data"
          export NODE_ENV=production
          export HOSTNAME=127.0.0.1
          export PORT=20128
          export REQUIRE_API_KEY=false
          export OMNIROUTE_MEMORY_MB=1024
          export INITIAL_PASSWORD="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export API_KEY_SECRET="$(openssl rand -hex 32)"
          nohup omniroute --no-open > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute.pid"
          READY=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:20128/v1/models -o "$RUNNER_TEMP/omniroute-models.json"; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            cat "$RUNNER_TEMP/omniroute.log"
            echo "OmniRoute failed to start; direct LLM fallback will be used."
            exit 0
          fi
          if ! grep -Fq "$OMNIROUTE_MODEL" "$RUNNER_TEMP/omniroute-models.json"; then
            echo "Expected Gemini model not available in OmniRoute catalog."
            cat "$RUNNER_TEMP/omniroute-models.json"
            kill "$(cat "$RUNNER_TEMP/omniroute.pid")" || true
            exit 0
          fi
          {
            echo "OMNIROUTE_BASE_URL=http://127.0.0.1:20128/v1"
            echo "OMNIROUTE_MODEL=${OMNIROUTE_MODEL:-gemini/gemini-2.5-flash}"
          } >> "$GITHUB_ENV"
          echo "OmniRoute is ready on the private GitHub-hosted runner."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce, render and upload to YouTube
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD=true
          else
            UPLOAD="${INPUT_UPLOAD}"
          fi
          if [ "${UPLOAD}" = "true" ]; then
            nextgen-academy auto-run --topic "${INPUT_TOPIC}" --upload
          else
            nextgen-academy auto-run --topic "${INPUT_TOPIC}"
          fi
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-production-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
