name: Automated YouTube documentary factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional documentary topic; leave blank for automatic discovery"
        required: false
        type: string
      duration_minutes:
        description: "Documentary duration (3-10 minutes)"
        required: true
        default: "5"
        type: choice
        options: ["3","4","5","6","7","8","9","10"]
      upload:
        description: "Upload the finished documentary to YouTube as private"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 6 * * 2,5"
permissions:
  contents: read
concurrency:
  group: nextgen-documentary-factory
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ALLOW_PAID_LLM: "false"
      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || 'gemini,groq,openrouter' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_ALLOW_PUBLIC: "false"
      TTS_VOICE: en-US-AriaNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install application
        run: python -m pip install -e ".[cloud]"
      - name: Produce documentary
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DURATION: ${{ inputs.duration_minutes || '5' }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          UPLOAD=""
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            UPLOAD="--upload"
          elif [ "${INPUT_UPLOAD}" = "true" ]; then
            UPLOAD="--upload"
          fi
          nextgen-academy auto-run --topic "${INPUT_TOPIC}" --duration-minutes "${INPUT_DURATION}" ${UPLOAD}
      - name: Preserve production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-documentary-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
