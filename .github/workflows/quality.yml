name: Quality checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate example video manifest
        env:
          PYTHONPATH: src
        run: python -m nextgen_tech_academy.video_policy examples/video_metadata.json
      - name: Validate example script duration
        env:
          PYTHONPATH: src
        run: python -m nextgen_tech_academy.script_timing examples/sample_script.txt
